version: "3.9"
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: chat_server
    ports:
      - "5000:65432"

  client1:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: chat_client1
    depends_on:
      - server
    stdin_open: true
    tty: true

  client2:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: chat_client2
    depends_on:
      - server
    stdin_open: true
    tty: true
  client3:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: chat_client3
    depends_on:
      - server
    stdin_open: true
    tty: true